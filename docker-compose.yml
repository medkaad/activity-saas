services:
  db:
    image: postgres:16-alpine
    container_name: activity_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    container_name: activity_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: activity_backend
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: activity_worker
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
      - db
    command: >
      sh -c "
      celery -A config worker -l info
      "

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: activity_beat
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
      - db
    command: >
      sh -c "
      celery -A config beat -l info
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: activity_frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: >
      sh -c "
      npm install &&
      npm run dev -- --host 0.0.0.0 --port 5173
      "

volumes:
  pgdata:

