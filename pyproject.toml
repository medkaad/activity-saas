[tool.black]
line-length = 100
target-version = ["py312"]
exclude = "migrations"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["organizations", "activities", "ai", "planning"]